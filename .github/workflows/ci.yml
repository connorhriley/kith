name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.13.0', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/validate-native-clients.mjs
      - name: Report runtime capabilities
        run: node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(':memory:'); console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,fts5:Boolean(db.prepare(\"SELECT 1 FROM pragma_module_list WHERE name='fts5'\").get())})); db.close();"
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=junit --outputFile=artifacts/tests.xml
      - run: git diff --check
      - run: pnpm test:package
      - run: node examples/two-agents.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/tests.xml
          if-no-files-found: ignore
          retention-days: 14
