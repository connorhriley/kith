name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.13.0', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/validate-native-clients.mjs
      - name: Build and test native macOS helper
        if: runner.os == 'macOS'
        run: pnpm build:menubar && pnpm test:menubar
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=junit --outputFile=artifacts/tests.xml
      - run: pnpm protocol:check
      - run: git diff --check
      - run: pnpm test:package
      - run: node examples/two-agents.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/tests.xml
          if-no-files-found: ignore
          retention-days: 14
