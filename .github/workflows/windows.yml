name: Windows validation
on:
  push:
    # A matching v$version tag installs kith-coord from the npm registry. The
    # release workflow publishes that version first, then calls this workflow.
    # Starting it on the tag push itself would look up a version that is not
    # published yet.
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_source:
        description: 'archive packs this checkout; registry installs the published version; auto uses the registry only on a matching v$version tag.'
        required: false
        type: string
        default: auto
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install a clean package consumer
        shell: pwsh
        env:
          KITH_PACKAGE_SOURCE: ${{ inputs.package_source || 'auto' }}
        run: |
          $releaseManifest = Get-Content package.json -Raw | ConvertFrom-Json
          $requested = if ([string]::IsNullOrWhiteSpace($env:KITH_PACKAGE_SOURCE)) { 'auto' } else { $env:KITH_PACKAGE_SOURCE.Trim() }
          $tagMatches = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -eq "v$($releaseManifest.version)"
          if ($requested -eq 'registry' -or ($requested -eq 'auto' -and $tagMatches)) {
            $packageSource = "$($releaseManifest.name)@$($releaseManifest.version)"
            $sourceKind = 'registry'
          } elseif ($requested -eq 'archive' -or $requested -eq 'auto') {
            $packed = npm pack --ignore-scripts --json --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packageSource = Join-Path $env:RUNNER_TEMP $packed[0].filename
            $sourceKind = 'archive'
          } else {
            Write-Error "KITH_PACKAGE_SOURCE must be auto, archive, or registry."
            exit 1
          }
          $consumer = Join-Path $env:RUNNER_TEMP 'kith clean consumer'
          # npm can take a minute to serve a version that was just published.
          # Each attempt uses a fresh cache so a 404 is not reused.
          $attempts = if ($sourceKind -eq 'registry') { 20 } else { 1 }
          $installed = $false
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            if (Test-Path $consumer) { Remove-Item -Recurse -Force $consumer }
            New-Item -ItemType Directory -Force $consumer | Out-Null
            $cache = Join-Path $env:RUNNER_TEMP "kith clean npm cache $attempt"
            npm install --prefix $consumer --cache $cache --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund $packageSource
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            if ($attempt -lt $attempts) {
              Write-Host "Registry install of $packageSource failed (attempt $attempt of $attempts). Waiting 15 seconds for npm."
              Start-Sleep -Seconds 15
            }
          }
          if (-not $installed) { exit 1 }
          $installedCli = Join-Path $consumer "node_modules/$($releaseManifest.name)/dist/cli/index.js"
          "KITH_VALIDATION_CLI=$installedCli" >> $env:GITHUB_ENV
          "KITH_VALIDATION_SOURCE=$sourceKind" >> $env:GITHUB_ENV
      - run: node scripts/validate-windows.mjs artifacts/windows.json
      - name: Validate the bundled editor server on Windows
        if: matrix.node == '24'
        run: |
          npm --prefix extensions/editor ci --ignore-scripts --no-audit --no-fund
          npm --prefix extensions/editor run check
      - name: Preserve native Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-node-${{ matrix.node }}
          path: artifacts/windows.json
          if-no-files-found: error
          retention-days: 14
