name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install a clean package consumer
        shell: pwsh
        run: |
          $releaseManifest = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -eq "v$($releaseManifest.version)") {
            $packageSource = "$($releaseManifest.name)@$($releaseManifest.version)"
            $sourceKind = 'registry'
          } else {
            $packed = npm pack --ignore-scripts --json --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packageSource = Join-Path $env:RUNNER_TEMP $packed[0].filename
            $sourceKind = 'archive'
          }
          $consumer = Join-Path $env:RUNNER_TEMP 'kith clean consumer'
          $cache = Join-Path $env:RUNNER_TEMP 'kith clean npm cache'
          New-Item -ItemType Directory -Force $consumer | Out-Null
          npm install --prefix $consumer --cache $cache --registry https://registry.npmjs.org --ignore-scripts --no-audit --no-fund $packageSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedCli = Join-Path $consumer "node_modules/$($releaseManifest.name)/dist/cli/index.js"
          "KITH_VALIDATION_CLI=$installedCli" >> $env:GITHUB_ENV
          "KITH_VALIDATION_SOURCE=$sourceKind" >> $env:GITHUB_ENV
      - run: node scripts/validate-windows.mjs artifacts/windows.json
      - name: Validate the bundled editor server on Windows
        if: matrix.node == '24'
        run: |
          npm --prefix extensions/editor ci --ignore-scripts --no-audit --no-fund
          npm --prefix extensions/editor run check
      - name: Preserve native Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-node-${{ matrix.node }}
          path: artifacts/windows.json
          if-no-files-found: error
          retention-days: 14
